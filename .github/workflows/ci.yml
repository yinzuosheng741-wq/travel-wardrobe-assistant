name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install -r requirements-desktop.txt -c portable-lock.txt
      - run: .venv/Scripts/python.exe -m pip check
      - run: .venv/Scripts/python.exe -m compileall -q stylemate desktop.py
      - run: .venv/Scripts/python.exe desktop.py --check
      - run: .venv/Scripts/python.exe desktop.py --no-ui

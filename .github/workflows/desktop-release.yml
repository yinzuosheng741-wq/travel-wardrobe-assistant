name: Build Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-common.txt
            requirements-desktop.txt
            portable-lock.txt
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install -r requirements-desktop.txt -c portable-lock.txt pyinstaller==6.11.1
      - run: .venv/Scripts/python.exe -m pip check
      - run: .venv/Scripts/python.exe desktop.py --check
      - run: .venv/Scripts/python.exe scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: TravelWardrobeAssistant-Windows
          path: dist/TravelWardrobeAssistant-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14
